name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-secret-scanning:
    name: Secret Scanning & Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-verification:
    name: Backend CI (Python 3.11.9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Pinned Python Version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Linter Check
        run: |
          python -m ruff check backend/

      - name: Mypy Strict Static Type Check
        run: |
          python -m mypy backend/

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip_audit || true

      - name: Execute Pytest Hermetic Test Suite
        env:
          ENV: test
          DEMO_MODE: 'true'
          JWT_SECRET: ci_test_secret_for_jwt_signing_key_only_must_be_long_enough
          URL_SIGNING_SECRET: ci_test_secret_for_url_signing_key_only_must_be_long_enough
        run: |
          pytest backend/ -v

  frontend-verification:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: ESLint Code Quality Gate
        run: npx eslint src/

      - name: Prettier Code Formatting Check
        run: npx prettier --check src/

      - name: Frontend Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Execute Vitest Frontend Unit Tests
        run: npx vitest run

      - name: Production TypeScript Build
        run: npm run build
