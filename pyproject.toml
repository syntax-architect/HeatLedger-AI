[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
    ".agents",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["attr-defined", "union-attr", "arg-type", "index", "assignment", "operator", "call-overload", "dict-item", "var-annotated"]
exclude = [
    "backend/.venv",
    ".venv",
    "node_modules",
    ".agents"
]

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
