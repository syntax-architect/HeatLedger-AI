name: HeatLedger AI · CI/CD Acceptance Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-tests:
    name: Backend Pytest & Acceptance (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/

      - name: Run Full Acceptance Lifecycle Script (B13)
        run: |
          python backend/test_full_acceptance.py

  frontend-quality-and-build:
    name: Frontend Vitest & Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Run TypeScript Type Check & Vite Build
        run: |
          npm run build
