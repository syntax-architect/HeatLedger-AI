name: HeatLedger AI · CI Quality, Security & Acceptance Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Lint, Type Check & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret History Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python Dependencies (Hash-Verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Secret Scan & Forbidden Strings Check
        run: |
          chmod +x scripts/check_secrets.sh
          ./scripts/check_secrets.sh

      - name: Python Ruff Linting
        run: ruff check backend/

      - name: Python Bandit Security Scan
        run: bandit -r backend/ -x backend/.venv,backend/tests,backend/test_*.py -ll -ii --skip B104

      - name: Python Mypy Type Verification
        run: mypy backend/settings.py backend/observability.py backend/regulatory_dates.py

      - name: Dependency Security Audits (Fail on High/Known CVEs)
        run: |
          pip-audit -r backend/requirements.txt --desc on
          pip-audit -r backend/requirements-dev.txt --desc on
          npm audit --audit-level=high

  backend-tests:
    name: Backend Pytest & Migrations (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heatledger
          POSTGRES_PASSWORD: heatledger_secure_2026
          POSTGRES_DB: heatledger_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies (Hash-Verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.txt

      - name: Run Database Migrations Test (Fresh & Upgrade)
        env:
          DATABASE_URL: postgresql://heatledger:heatledger_secure_2026@localhost:5432/heatledger_test_db
        run: |
          python -m pytest backend/test_d3_migrations_and_ci.py -v

      - name: Run Full Backend Test Suite
        env:
          ENV: development
          DATABASE_URL: postgresql://heatledger:heatledger_secure_2026@localhost:5432/heatledger_test_db
        run: |
          python -m pytest backend/

  frontend-tests-and-build:
    name: Frontend Vitest & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Strict TypeScript Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Component Tests
        run: npm test -- --run

      - name: Run TypeScript & Production Build
        run: npm run build

      - name: Verify Bundle Size Budgets (Prompt M4)
        run: node scripts/check_bundle_budget.mjs

      - name: Verify Cloudflare Pages Output
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          echo "Cloudflare Pages bundle build verified."

  container-scan:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Production API Image
        run: docker build -t heatledger-api:ci .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: heatledger-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
