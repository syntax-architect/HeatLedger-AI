    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 90,25 90,75 50,95 10,75 10,25' fill='%23090D16' stroke='%2310B981' stroke-width='6'/><polygon points='50,22 75,37 75,63 50,78 25,63 25,37' fill='%23F59E0B' opacity='0.9'/><path d='M50,5 L50,95 M10,25 L90,75 M10,75 L90,25' stroke='%2310B981' stroke-width='2' opacity='0.4'/></svg>" />
    <title>HeatLedger AI — Heat-to-Customs Traceability & CBAM Operating System</title>
    
    <script>
      try {
        const stored = localStorage.getItem('hl_theme_mode') || localStorage.getItem('heatledger-theme');
        const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = stored === 'dark' || (!stored && isSystemDark) || (stored === 'system' && isSystemDark) || (!stored);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>

  </body>
