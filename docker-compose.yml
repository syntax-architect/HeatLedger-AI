# ==============================================================================
# HeatLedger AI - Local Development Stack (Prompt D2 & Prompt v5 Task 4.1)
# Local services: api + postgres db + mailhog.
# Frontend runs directly on host via `npm run dev` for fast HMR.
# Required secrets MUST be supplied via .env (no hardcoded fallback secrets).
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heatledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-heatledger_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heatledger} -d ${POSTGRES_DB:-heatledger_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=${ENV:-development}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-heatledger}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-heatledger_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET (>=32 random chars) in .env}
      - URL_SIGNING_SECRET=${URL_SIGNING_SECRET:?Set URL_SIGNING_SECRET (>=32 random chars) in .env}
      - DOCUMENT_URL_SECRET=${DOCUMENT_URL_SECRET:?Set DOCUMENT_URL_SECRET (>=32 random chars) in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (>=32 random chars) in .env}
      - ENCRYPTION_KEY_VERSION=${ENCRYPTION_KEY_VERSION:-v1}
      - ENCRYPTION_PREVIOUS_KEYS=${ENCRYPTION_PREVIOUS_KEYS:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - INTAKE_EMAIL_WEBHOOK_SECRET=${INTAKE_EMAIL_WEBHOOK_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI inbox

volumes:
  postgres_data:
