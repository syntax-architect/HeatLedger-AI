services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heatledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatledger_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-heatledger_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatledger -d heatledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-heatledger}:${POSTGRES_PASSWORD:-heatledger_secure_2026}@db:5432/${POSTGRES_DB:-heatledger_db}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

