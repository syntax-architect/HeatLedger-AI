# ==============================================================================
# HeatLedger AI - Local Development Stack (Prompt D2)
# Local services: api + postgres db + mailhog.
# Frontend runs directly on host via `npm run dev` for fast HMR.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heatledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatledger_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-heatledger_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatledger -d heatledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEMO_MODE=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-heatledger}:${POSTGRES_PASSWORD:-heatledger_secure_2026}@db:5432/${POSTGRES_DB:-heatledger_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=dev_jwt_secret_64_characters_long_for_local_development_testing_only!
      - URL_SIGNING_SECRET=dev_url_signing_secret_64_characters_for_local_development_testing!
      - ENCRYPTION_KEY=dev_aes_encryption_key_32_bytes_long_exact!
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI inbox

volumes:
  postgres_data:
